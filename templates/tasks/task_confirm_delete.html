{% extends 'base.html' %}
{% block title %}Delete Task{% endblock %}
{% block page_title %}Delete Task{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="card p-4">
    <div style="text-align:center; padding:16px 0 24px;">
      <div style="width:56px; height:56px; border-radius:14px; background:rgba(239,68,68,0.1); color:var(--danger); font-size:1.5rem; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
        <i class="bi bi-trash"></i>
      </div>
      <h5 class="font-display">Delete "{{ task.title }}"?</h5>
      <p class="text-muted" style="font-size:0.88rem;">This task will be permanently deleted. This action cannot be undone.</p>
    </div>
    <form method="post" class="d-flex gap-2 justify-content-center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'project_detail' task.project.pk %}" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
